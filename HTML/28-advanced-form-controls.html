<h1>Advanced Form Controls & HTML Validation</h1>

<blockquote><p>🟡 Intermediate</p></blockquote>

<h2>📖 Definition</h2>

<p>HTML provides advanced form controls—including <strong><code><fieldset></code></strong>, <strong><code><legend></code></strong>, <strong><code><select></code></strong>, <strong><code><optgroup></code></strong>, <strong><code><textarea></code></strong>, and <strong><code><datalist></code></strong>—alongside native client-side validation attributes (<code>pattern</code>, <code>minlength</code>, <code>maxlength</code>, <code>min</code>, <code>max</code>, <code>step</code>, <code>autofocus</code>, <code>autocomplete</code>) to collect and validate complex user input without requiring initial JavaScript.</p>

<h2>🌍 Multilingual Summary</h2>

<h3>English</h3>
<p>Advanced form elements like <code><fieldset></code>, <code><legend></code>, <code><optgroup></code>, <code><textarea></code>, and <code><datalist></code> structure complex inputs, while validation attributes (<code>pattern</code>, <code>required</code>) validate user data natively.</p>

<h3>Hindi</h3>
<p>Advanced form elements (<code><fieldset></code>, <code><legend></code>, <code><optgroup></code>, <code><textarea></code>, <code><datalist></code>) complex forms ko organize karte hain, aur validation attributes (<code>pattern</code>, <code>required</code>) user data ko browser mein validate karte hain.</p>

<h3>Marathi</h3>
<p>Advanced form controls (<code><fieldset></code>, <code><legend></code>, <code><optgroup></code>, <code><textarea></code>, <code><datalist></code>) complex form structure tayar kartat, ani validation attributes (<code>pattern</code>, <code>required</code>) browser madhye mahiti validate kartat.</p>

<h2>🤔 Why Do We Use Advanced Form Controls?</h2>

<p>Organizing long forms with <code><fieldset></code> and grouping dropdown options with <code><optgroup></code> improves usability and accessibility. <code><datalist></code> provides auto-complete suggestions while still allowing custom text entry.</p>

<h2>🧱 Advanced Form Elements Reference</h2>

<table>
<p>  <thead><tr><th>Element</th><th>Description & Purpose</th><th>Code Example</th></tr></thead></p>
<p>  <tbody></p>
<p>    <tr><td><strong><code><fieldset></code></strong></td><td>Visually and semantically groups related form fields together with a border wrapper.</td><td><code><fieldset>...</fieldset></code></td></tr></p>
<p>    <tr><td><strong><code><legend></code></strong></td><td>Provides a caption title for its parent <code><fieldset></code>.</td><td><code><legend>Personal Info</legend></code></td></tr></p>
<p>    <tr><td><strong><code><select></code></strong></td><td>Dropdown selection menu.</td><td><code><select name="country"></code></td></tr></p>
<p>    <tr><td><strong><code><optgroup></code></strong></td><td>Groups related <code><option></code> items inside a <code><select></code> dropdown menu.</td><td><code><optgroup label="Asia"></code></td></tr></p>
<p>    <tr><td><strong><code><textarea></code></strong></td><td>Multi-line text field with customizable <code>rows</code> and <code>cols</code>.</td><td><code><textarea rows="4" cols="50"></code></td></tr></p>
<p>    <tr><td><strong><code><datalist></code></strong></td><td>Provides a predefined list of auto-complete options for an <code><input></code>.</td><td><code><input list="browsers"></code></td></tr></p>
<p>  </tbody></p>
<p></table></p>

<h2>🔑 Native Validation Attributes</h2>

<ul>
<p>  <li><strong><code>required</code>:</strong> Mandates that the field must be filled out before submitting.</li></p>
<p>  <li><strong><code>pattern="regex"</code>:</strong> Validates input text against a regular expression pattern (e.g. <code>pattern="[0-9]{10}"</code> for 10-digit phone numbers).</li></p>
<p>  <li><strong><code>minlength</code> & <code>maxlength</code>:</strong> Sets character length constraints on text entries.</li></p>
<p>  <li><strong><code>min</code> & <code>max</code>:</strong> Sets numeric or date range boundaries.</li></p>
<p>  <li><strong><code>autofocus</code>:</strong> Automatically focuses the input field when the page loads.</li></p>
<p>  <li><strong><code>autocomplete="on|off|email|username"</code>:</strong> Assists browsers in auto-filling saved user information.</li></p>
<p></ul></p>

<h2>💻 Code Example</h2>

<pre><code class="language-html">&lt;!DOCTYPE html&gt;
<p>&lt;html lang=&quot;en&quot;&gt;</p>
<p>&lt;head&gt;</p>
<p>  &lt;meta charset=&quot;UTF-8&quot;&gt;</p>
<p>  &lt;title&gt;Advanced Form Controls Practice&lt;/title&gt;</p>
<p>&lt;/head&gt;</p>
<p>&lt;body&gt;</p>

<p>  &lt;h1&gt;Job Application Form&lt;/h1&gt;</p>

<p>  &lt;form action=&quot;/apply&quot; method=&quot;POST&quot;&gt;</p>

<p>    &lt;fieldset&gt;</p>
<p>      &lt;legend&gt;Applicant Information&lt;/legend&gt;</p>

<p>      &lt;p&gt;</p>
<p>        &lt;label for=&quot;applicant-name&quot;&gt;Full Name:&lt;/label&gt;&lt;br&gt;</p>
<p>        &lt;input id=&quot;applicant-name&quot; type=&quot;text&quot; name=&quot;name&quot; required minlength=&quot;3&quot; autofocus autocomplete=&quot;name&quot;&gt;</p>
<p>      &lt;/p&gt;</p>

<p>      &lt;p&gt;</p>
<p>        &lt;label for=&quot;city-input&quot;&gt;Preferred Work City (Auto-suggest):&lt;/label&gt;&lt;br&gt;</p>
<p>        &lt;input id=&quot;city-input&quot; type=&quot;text&quot; name=&quot;city&quot; list=&quot;city-suggestions&quot; placeholder=&quot;Type or select a city&quot;&gt;</p>
<p>        &lt;datalist id=&quot;city-suggestions&quot;&gt;</p>
<p>          &lt;option value=&quot;Mumbai&quot;&gt;</p>
<p>          &lt;option value=&quot;Delhi&quot;&gt;</p>
<p>          &lt;option value=&quot;Bengaluru&quot;&gt;</p>
<p>          &lt;option value=&quot;Pune&quot;&gt;</p>
<p>          &lt;option value=&quot;Hyderabad&quot;&gt;</p>
<p>        &lt;/datalist&gt;</p>
<p>      &lt;/p&gt;</p>

<p>      &lt;p&gt;</p>
<p>        &lt;label for=&quot;country-select&quot;&gt;Country &amp; Region:&lt;/label&gt;&lt;br&gt;</p>
<p>        &lt;select id=&quot;country-select&quot; name=&quot;country&quot; required&gt;</p>
<p>          &lt;option value=&quot;&quot;&gt;-- Select Country --&lt;/option&gt;</p>
<p>          &lt;optgroup label=&quot;Asia&quot;&gt;</p>
<p>            &lt;option value=&quot;IN&quot;&gt;India&lt;/option&gt;</p>
<p>            &lt;option value=&quot;JP&quot;&gt;Japan&lt;/option&gt;</p>
<p>          &lt;/optgroup&gt;</p>
<p>          &lt;optgroup label=&quot;Europe&quot;&gt;</p>
<p>            &lt;option value=&quot;UK&quot;&gt;United Kingdom&lt;/option&gt;</p>
<p>            &lt;option value=&quot;DE&quot;&gt;Germany&lt;/option&gt;</p>
<p>          &lt;/optgroup&gt;</p>
<p>        &lt;/select&gt;</p>
<p>      &lt;/p&gt;</p>
<p>    &lt;/fieldset&gt;</p>

<p>    &lt;fieldset&gt;</p>
<p>      &lt;legend&gt;Experience Summary&lt;/legend&gt;</p>

<p>      &lt;p&gt;</p>
<p>        &lt;label for=&quot;bio&quot;&gt;Short Cover Letter:&lt;/label&gt;&lt;br&gt;</p>
<p>        &lt;textarea id=&quot;bio&quot; name=&quot;coverLetter&quot; rows=&quot;4&quot; cols=&quot;50&quot; placeholder=&quot;Summarize your relevant experience...&quot;&gt;&lt;/textarea&gt;</p>
<p>      &lt;/p&gt;</p>
<p>    &lt;/fieldset&gt;</p>

<p>    &lt;p&gt;</p>
<p>      &lt;button type=&quot;submit&quot;&gt;Submit Application&lt;/button&gt;</p>
<p>    &lt;/p&gt;</p>

<p>  &lt;/form&gt;</p>

<p>&lt;/body&gt;</p>
<p>&lt;/html&gt;</code></pre></p>

<h2>👀 Output / What You Will See</h2>

<p>A structured application form grouped with <code><fieldset></code> borders, auto-suggest city choices using <code><datalist></code>, grouped country dropdown options using <code><optgroup></code>, a multi-line cover letter <code><textarea></code>, and native form validation.</p>

<h2>🧪 Try It Yourself</h2>

<p>1. Create a form with two <code><fieldset></code> groups ("Contact Details" and "Preferences").</p>
<p>2. Create an input field connected to a <code><datalist></code> containing 4 course suggestions.</p>
<p>3. Create a <code><select></code> dropdown with two <code><optgroup></code> categories.</p>
<p>4. Add <code>pattern="[0-9]{10}"</code> validation on a phone input field.</p>

<h2>⚠️ Common Mistakes</h2>

<ul>
<p>  <li><strong>Forgetting matching <code>id</code> on <code><datalist></code>:</strong> The <code><input list="id"></code> must match the <code><datalist id="id"></code>.</li></p>
<p>  <li><strong>Forgetting <code>for</code> and <code>id</code> links on <code><label></code>:</strong> Breaks accessibility for screen reader users.</li></p>
<p></ul></p>

<h2>🌐 Real-World Usage</h2>

<p>E-commerce checkout forms, job application portals, hotel booking platforms, and government application forms rely on advanced form controls for organized, validated data entry.</p>
