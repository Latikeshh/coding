<h1>Images, <code><figure></code>, & <code><picture></code></h1>

<blockquote><p>🟢 Beginner</p></blockquote>

<h2>📖 Definition</h2>

<p>The <strong><code><img></code></strong> element embeds an image into a webpage. Modern HTML also provides <strong><code><figure></code></strong> and <strong><code><figcaption></code></strong> for self-contained captioned images, and <strong><code><picture></code></strong> for responsive art-direction images across different screen sizes.</p>

<h2>🌍 Multilingual Summary</h2>

<h3>English</h3>
<p>Embed images using <code><img></code> with descriptive <code>alt</code> text. Use <code><figure></code> and <code><figcaption></code> for image captions, and <code><picture></code> for displaying different images on mobile and desktop screens.</p>

<h3>Hindi</h3>
<p>Webpage par image add karne ke liye <code><img></code> aur <code>alt</code> text ka use karein. Image caption ke liye <code><figure></code> + <code><figcaption></code>, aur responsive images ke liye <code><picture></code> tag use hota hai.</p>

<h3>Marathi</h3>
<p>Webpage var photo dakhavnyasathi <code><img></code> ani <code>alt</code> text vapra. Photo la caption denyasathi <code><figure></code> ani <code><figcaption></code>, ani alag-alag screen sathi <code><picture></code> tag vapra.</p>

<h2>🤔 Why Do We Use Them?</h2>

<p>Images enhance visual engagement and convey information clearly. Accessible <code>alt</code> text ensures screen reader users understand image content, while specified intrinsic dimensions prevent layout shifting (Cumulative Layout Shift - CLS) during page loading.</p>

<h2>📐 Key Attributes of <code><img></code></h2>

<ul>
<p>  <li><strong><code>src</code> (Source):</strong> Specifies the relative file path or absolute URL of the image file (JPG, PNG, WebP, SVG, GIF).</li></p>
<p>  <li><strong><code>alt</code> (Alternative Text):</strong> Describes the image content for screen readers or if the image file fails to load.</li></p>
<p>  <li><strong><code>width</code> & <code>height</code>:</strong> Defines intrinsic pixel dimensions. Providing these attributes allows browsers to reserve screen layout space before images download, eliminating layout jumps.</li></p>
<p></ul></p>

<pre><code class="language-html">&lt;img src=&quot;assets/puppy.jpg&quot; alt=&quot;A golden retriever puppy sitting on a green lawn&quot; width=&quot;400&quot; height=&quot;300&quot;&gt;</code></pre>

<h2>🔍 How to Write Good <code>alt</code> Text</h2>

<table>
<p>  <thead><tr><th>Scenario</th><th>Accessible <code>alt</code> Text Example</th><th>Bad <code>alt</code> Text Example</th></tr></thead></p>
<p>  <tbody></p>
<p>    <tr><td><strong>Informative Image</strong></td><td><code>alt="A red sports car parked in front of a modern glass office building"</code></td><td><code>alt="image"</code> or <code>alt="car"</code></td></tr></p>
<p>    <tr><td><strong>Chart / Data</strong></td><td><code>alt="Bar chart showing annual revenue growth from $1M in 2024 to $2.5M in 2026"</code></td><td><code>alt="chart"</code></td></tr></p>
<p>    <tr><td><strong>Decorative Image</strong></td><td><code>alt=""</code> (Screen readers silently skip decorative borders or background icons)</td><td><code>alt="divider line"</code></td></tr></p>
<p>  </tbody></p>
<p></table></p>

<h2>🖼️ Captioned Images with <code><figure></code> & <code><figcaption></code></h2>

<p>When an image requires a visible caption, diagram reference, or explanation, wrap it inside a <code><figure></code> element:</p>

<pre><code class="language-html">&lt;figure&gt;
<p>  &lt;img src=&quot;images/everest.jpg&quot; alt=&quot;Snow-covered peak of Mount Everest against a blue sky&quot; width=&quot;600&quot; height=&quot;400&quot;&gt;</p>
<p>  &lt;figcaption&gt;Figure 1.1: Mount Everest summit photographed at sunrise.&lt;/figcaption&gt;</p>
<p>&lt;/figure&gt;</code></pre></p>

<h2>📱 Responsive Art Direction with <code><picture></code></h2>

<p>The <code><picture></code> element allows you to serve different image files depending on the user's screen width (e.g., a tall vertical image for mobile screens and a wide banner for desktop displays):</p>

<pre><code class="language-html">&lt;picture&gt;
<p>  &lt;!-- Desktop screen (800px and wider) --&gt;</p>
<p>  &lt;source media=&quot;(min-width: 800px)&quot; srcset=&quot;images/hero-desktop.jpg&quot;&gt;</p>
<p>  &lt;!-- Tablet screen (480px to 799px) --&gt;</p>
<p>  &lt;source media=&quot;(min-width: 480px)&quot; srcset=&quot;images/hero-tablet.jpg&quot;&gt;</p>
<p>  &lt;!-- Mobile screen fallback --&gt;</p>
<p>  &lt;img src=&quot;images/hero-mobile.jpg&quot; alt=&quot;Developer coding at a dual-monitor workstation&quot; width=&quot;400&quot; height=&quot;300&quot; loading=&quot;lazy&quot;&gt;</p>
<p>&lt;/picture&gt;</code></pre></p>

<h2>💻 Code Example</h2>

<pre><code class="language-html">&lt;!DOCTYPE html&gt;
<p>&lt;html lang=&quot;en&quot;&gt;</p>
<p>&lt;head&gt;</p>
<p>  &lt;meta charset=&quot;UTF-8&quot;&gt;</p>
<p>  &lt;title&gt;Nature Gallery&lt;/title&gt;</p>
<p>&lt;/head&gt;</p>
<p>&lt;body&gt;</p>

<p>  &lt;h1&gt;Scenic Mountain Showcase&lt;/h1&gt;</p>

<p>  &lt;figure&gt;</p>
<p>    &lt;img src=&quot;images/mountains.jpg&quot; alt=&quot;Snowy mountain range surrounded by pine trees during sunset&quot; width=&quot;600&quot; height=&quot;400&quot;&gt;</p>
<p>    &lt;figcaption&gt;Sunset view over the Rocky Mountains.&lt;/figcaption&gt;</p>
<p>  &lt;/figure&gt;</p>

<p>&lt;/body&gt;</p>
<p>&lt;/html&gt;</code></pre></p>

<h2>👀 Output / What You Will See</h2>

<p>The browser displays the mountain photograph with specified dimensions, accompanied by a clean visible caption below the image.</p>

<h2>🧪 Try It Yourself</h2>

<p>1. Add an <code><img></code> tag with descriptive <code>alt</code> text and <code>width</code>/<code>height</code> dimensions.</p>
<p>2. Wrap the image inside a <code><figure></code> tag and add a visible caption using <code><figcaption></code>.</p>
<p>3. Experiment with <code><picture></code> using <code>srcset</code> and <code>media</code> rules.</p>

<h2>⚠️ Common Mistakes</h2>

<ul>
<p>  <li><strong>Writing meaningless <code>alt</code> text:</strong> Using <code>alt="image.jpg"</code> or <code>alt="photo"</code>.</li></p>
<p>  <li><strong>Incorrect file paths:</strong> Writing <code>src="pic.jpg"</code> when the file is inside an <code>images/</code> folder (<code>src="images/pic.jpg"</code>).</li></p>
<p>  <li><strong>Omitting <code>width</code> and <code>height</code>:</strong> Causes layout shifting as images load.</li></p>
<p></ul></p>

<h2>🌐 Real-World Usage</h2>

<p>E-commerce stores, news platforms, travel blogs, and portfolios use responsive images with captions and <code>alt</code> text for fast loading, SEO, and screen reader accessibility.</p>
